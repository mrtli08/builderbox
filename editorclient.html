<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <title>builderbox</title>
</head>
<body>
    <p>test version, also you can change if a part makes player oof (you must set it to true/false)</p>
    <p>(colors are in hex)</p>
    <button id="create" onclick="createobject()">Create new...</button>
    <br>
    <canvas id="canvas" width="800" height="400"></canvas>
    <br>
    <div id="edit">
        <p id="editX">x position: notselected</p>
        <button id="changeX" onclick="objectchangeX()">Change value...</button>
        <p id="editY">y position: notselected</p>
        <button id="changeY" onclick="objectchangeY()">Change value...</button>
        <p id="editoof">oof: notselected</p>
        <button id="changeoof" onclick="objectsetoof()">Change value...</button>
        <p id="sizex">size x: notselected</p>
        <p id="sizey">size y: notselected</p>
        <button id="changesize" onclick="resize()">Change value...</button>
        <p id="color">color: notselected</p>
        <button id="changecolor" onclick="objectchangecolor()">Change value...</button>
        <br>
        <button id="delete" onclick="deleteobject()">Delete...</button>
    </div>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        var rect = canvas.getBoundingClientRect();
        var selected = null;
        let editX = document.getElementById('editX');
        let editY = document.getElementById('editY');
        let changeX = document.getElementById('changeX');
        let changeY = document.getElementById('changeY');
        let changeoof = document.getElementById('changeoof');
        let editoof = document.getElementById('editoof');
        let sizex = document.getElementById('sizex');
        let sizey = document.getElementById('sizey');
        let color = document.getElementById('color');


        // x, y, width, height, lethal (OOF), color
        var objects = [[-400, 100, 800, 100, false, '#888888']];
        var player = {x: 0, y: -50, width: 30, height: 30};
        var isjumping = false;

        canvas.addEventListener("click", function(event) { 
            var mx = event.clientX - rect.left - (canvas.width/2);
            var my = event.clientY - rect.top - (canvas.height/2);
            selected = selectobject(mx, my);
            updateselectmenu();
        });

        document.addEventListener('keydown', function(event) {
            if (event.key === ' ') {
                if (!isjumping) {
                    moveplayer(0, -70);
                    isjumping = true;
                }
            }
            if (event.key === 'a') moveplayer(-10, 0);
            if (event.key === 's') moveplayer(0, 10);
            if (event.key === 'd') moveplayer(10, 0); // removed stray "z"
        });

        function addObject(x, y, width, height) {
            objects.push([x, y, width, height]);
        }

        function detectCollide(a, b) {
            return (
                a[0] + a[2] > b[0] && a[0] < b[0] + b[2] && a[1] + a[3] > b[1] && a[1] < b[1] + b[3]
            );
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = 'blue';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // draw objects
            for (let i = 0; i < objects.length; i++) {
                ctx.fillStyle = objects[i][5]; // use the color from the object array
                ctx.fillRect( 
                    (canvas.width/2) + objects[i][0],
                    (canvas.height/2) + objects[i][1],
                    objects[i][2],
                    objects[i][3]
                );
                if (i === selected) {
                ctx.strokeStyle = 'yellow';
                ctx.strokeRect(
                    (canvas.width/2) + objects[i][0],
                    (canvas.height/2) + objects[i][1],
                    objects[i][2],
                    objects[i][3]
                );
                }
            }

            // draw player
            ctx.fillStyle = 'yellow';
            ctx.fillRect(
                (canvas.width/2) + player.x,
                (canvas.height/2) + player.y,
                player.width,
                player.height
            );
        }

        function selectobject(mx, my) {
            for (let i = 0; i < objects.length; i++) {
                if (detectCollide([mx, my, 1, 1], objects[i])) {
                    return i;
                }
            }
            return null;
        }
        function moveplayer(dx, dy) {
            // new position box
            var newplayer = [
                player.x + dx,
                player.y + dy,
                player.width,
                player.height
            ];

            // check collisions
            for (let i = 0; i < objects.length; i++) {
                if (detectCollide(newplayer, objects[i])) {
                    if (objects[i][4]) { // check if object is lethal
                        respawn();
                        return;
                    }
                    isjumping = false; // reset jump state on collision
                    return; // cancel movement
                }
            }

            // no collision → apply movement
            player.x += dx;
            player.y += dy;
        }

        function gravity() {
            moveplayer(0, 0.5);
        }

        function game() {
            draw();
            gravity();
            requestAnimationFrame(game);
        }

        function updateselectmenu() {
            editX.textContent = "x position: " + (selected !== null ? objects[selected][0] : "notselected");
            editY.textContent = "y position: " + (selected !== null ? objects[selected][1] : "notselected");
            editoof.textContent = "oof: " + (selected !== null ? objects[selected][4].toString() : "notselected");
            sizex.textContent = "size x: " + (selected !== null ? objects[selected][2] : "notselected");
            sizey.textContent = "size y: " + (selected !== null ? objects[selected][3] : "notselected");
            color.textContent = "color: " + (selected !== null ? objects[selected][5] : "notselected");
        }

        function objectchangeX() {
            if (selected !== null) {
                let newX = prompt("enter new value for x position of object");
                if (newX !== null) {
                    objects[selected][0] = parseInt(newX);
                    updateselectmenu();
                }
            }
        }

        function objectchangeY() {
            if (selected !== null) {
                let newY = prompt("enter new value for y position of object");
                if (newY !== null) {
                    objects[selected][1] = parseInt(newY);
                    updateselectmenu();
                }
            }
        }

        function objectsetoof() {
            if (selected !== null) {
                let newY = prompt("if you enter true object will make player oof else it wouldnt");
                if (newY !== null) {
                    objects[selected][4] = newY === "true";
                    updateselectmenu();
                }
            }
        }

        function respawn() {
            player.x = 0;
            player.y = -50;
            isjumping = false;
        }

        function resize() {
           var sizeX = prompt("enter new value for size x of object");
           var sizeY = prompt("enter new value for size y of object");
              if (sizeX !== null && sizeY !== null) {
                objects[selected][2] = parseInt(sizeX);
                objects[selected][3] = parseInt(sizeY);
                updateselectmenu();
              } 
        }

        function objectchangecolor() {
            if (selected !== null) {
                let newColor = prompt("enter new color in hex format (e.g. #ff0000 for red)");
                if (newColor !== null) {
                    objects[selected][5] = newColor;
                    updateselectmenu();
                }
            }
        }

        function createobject() {
            objects.push([0, 0, 50, 50, false, '#888888']);
        }

        function deleteobject() {
            if (selected !== null) {
                objects.splice(selected, 1);
                selected = null;
                updateselectmenu();
            }
        }

        game();
    </script>
</body>
</html>
