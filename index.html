<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Builderbox</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: sans-serif;
            background: #111;
            color: white;
            touch-action: none;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            pointer-events: none;
            background: rgba(0,0,0,0.5);
            padding: 10px;
            border-radius: 5px;
            z-index: 10;
        }
        /* Mobile On-Screen D-Pad - Forced to show now! */
        #mobile-controls {
            position: absolute;
            bottom: 30px;
            left: 30px;
            display: grid; /* Always visible now */
            grid-template-columns: repeat(3, 65px);
            grid-template-rows: repeat(2, 65px);
            gap: 10px;
            z-index: 100; /* High z-index so it sits on top of the 3D canvas */
        }
        .ctrl-btn {
            background: rgba(255, 255, 255, 0.25);
            border: 2px solid rgba(255, 255, 255, 0.6);
            color: white;
            font-size: 22px;
            font-weight: bold;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-user-select: none;
        }
        .ctrl-btn:active {
            background: rgba(255, 255, 255, 0.6);
        }
        #btn-w { grid-column: 2; grid-row: 1; }
        #btn-a { grid-column: 1; grid-row: 2; }
        #btn-s { grid-column: 2; grid-row: 2; }
        #btn-d { grid-column: 3; grid-row: 2; }
    </style>
</head>
<body>
    <div id="ui">
        <h2>Builderbox</h2>
        <p>Use keyboard or click/touch buttons to move.</p>
    </div>

    <!-- Mobile D-Pad UI -->
    <div id="mobile-controls">
        <div class="ctrl-btn" id="btn-w">W</div>
        <div class="ctrl-btn" id="btn-a">A</div>
        <div class="ctrl-btn" id="btn-s">S</div>
        <div class="ctrl-btn" id="btn-d">D</div>
    </div>

    <!-- Include Three.js and Socket.io from CDNs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
