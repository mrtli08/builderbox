<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Builderbox</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: sans-serif;
            background: #111;
            color: white;
            touch-action: none;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            pointer-events: none;
            background: rgba(0,0,0,0.5);
            padding: 10px;
            border-radius: 5px;
            z-index: 10;
        }
        
        #chat-container {
            position: absolute;
            top: 90px;
            left: 10px;
            width: 280px;
            height: 180px;
            display: flex;
            flex-direction: column;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            padding: 8px;
            z-index: 100;
        }
        #chat-messages {
            flex-grow: 1;
            overflow-y: auto;
            font-size: 13px;
            margin-bottom: 6px;
            word-break: break-word;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        #chat-form {
            display: flex;
            gap: 5px;
        }
        #chat-input {
            flex-grow: 1;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: white;
            padding: 6px;
            border-radius: 4px;
            outline: none;
            font-size: 13px;
        }
        #chat-input:focus {
            background: rgba(255, 255, 255, 0.25);
            border-color: #3399ff;
        }
        #chat-form button {
            background: #3399ff;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Mobile Controls Layout */
        #mobile-controls {
            position: absolute;
            bottom: 30px;
            left: 30px;
            display: grid;
            grid-template-columns: repeat(3, 65px);
            grid-template-rows: repeat(2, 65px);
            gap: 10px;
            z-index: 100;
        }
        .ctrl-btn {
            background: rgba(255, 255, 255, 0.25);
            border: 2px solid rgba(255, 255, 255, 0.6);
            color: white;
            font-size: 22px;
            font-weight: bold;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-user-select: none;
        }
        .ctrl-btn:active {
            background: rgba(255, 255, 255, 0.6);
        }
        #btn-w { grid-column: 2; grid-row: 1; }
        #btn-a { grid-column: 1; grid-row: 2; }
        #btn-s { grid-column: 2; grid-row: 2; }
        #btn-d { grid-column: 3; grid-row: 2; }

        /* Jump Button Styling */
        #jump-control {
            position: absolute;
            bottom: 30px;
            right: 30px;
            width: 80px;
            height: 80px;
            background: rgba(255, 100, 100, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.6);
            color: white;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            user-select: none;
        }
        #jump-control:active {
            background: rgba(255, 100, 100, 0.8);
        }
    </style>
</head>
<body>
    <div id="ui">
        <h2>Builderbox</h2>
        <p>Use WASD / D-pad to move, Space / Jump to jump.</p>
    </div>

    <div id="chat-container">
        <div id="chat-messages"></div>
        <form id="chat-form">
            <input type="text" id="chat-input" placeholder="Type a chat message..." autocomplete="off" />
            <button type="submit">Send</button>
        </form>
    </div>

    <!-- D-Pad -->
    <div id="mobile-controls">
        <div class="ctrl-btn" id="btn-w">W</div>
        <div class="ctrl-btn" id="btn-a">A</div>
        <div class="ctrl-btn" id="btn-s">S</div>
        <div class="ctrl-btn" id="btn-d">D</div>
    </div>

    <!-- Jump Button -->
    <div id="jump-control">JUMP</div>

    <!-- CDNs: Three.js, Cannon.js Physics, and Socket.io -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
